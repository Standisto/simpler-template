# This file configures git pre-commit hooks that enforce global code style across Crystal.
# Define global style hooks.
- repo: https://github.com/pre-commit/pre-commit-hooks
  rev: v4.3.0
  hooks:
    - id: end-of-file-fixer
    - id: trailing-whitespace
      args: ["--markdown-linebreak-ext=md"]
      # Exclude JS snapshot tests and shell executables.
      exclude: ^.*(snap|\.sh)
    - id: requirements-txt-fixer

# Define frontend stack (html, javascript, typescript, json, css, markdown, and yaml files) style hooks.
- repo: https://github.com/awebdeveloper/pre-commit-tslint
  rev: v0.0.2
  hooks:
    - id: tslint
      args: ["-c", "lib/crystal-ui/tslint.yaml"]
      additional_dependencies:
        - tslint@5.18.0
        - typescript@3.5.1

- repo: https://github.com/prettier/prettier
  rev: 1.18.2
  hooks:
    - id: prettier
      exclude: style.md

# Define Python stack style hooks.
- repo: https://github.com/lucasmbrown/mirrors-autoflake
  rev: v1.3
  hooks:
    - id: autoflake
      args:
        [
          "--in-place",
          "--remove-all-unused-imports",
          "--remove-unused-variable",
          "--ignore-init-module-imports",
        ]

- repo: https://github.com/asottile/reorder_python_imports
  rev: v1.6.0
  hooks:
    - id: reorder-python-imports
      language_version: python3.7
      args:
        [
          "--application-directories=.:lib/crystal-app:lib/crystal-cli:lib/crystal-uptime-tests",
        ]

- repo: https://github.com/ambv/black
  rev: stable
  hooks:
    - id: black
      language_version: python3.7

- repo: https://github.com/asottile/pyupgrade
  rev: v2.4.1
  hooks:
    - id: pyupgrade
      language_version: python3.7
      args: [--py36-plus]
      # Ignore this file used by `gcloud`, which uses Python 2 syntax.
      exclude: lib/crystal-cli/crystal/cli/resources/templates/deployment_manager/crystal_resources.py

- repo: https://github.com/terrencepreilly/darglint
  rev: master
  hooks:
    - id: darglint
      language_version: python3.7
      # Exclude test files.
      exclude: ^.*(_test.py)$
